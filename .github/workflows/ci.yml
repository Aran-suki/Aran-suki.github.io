name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      comments: ${{ steps.filter.outputs.comments }}
      styles: ${{ steps.filter.outputs.styles }}
    steps:
      - name: Checkout history for path detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Manual runs and new branch pushes deliberately run every suite.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "comments=true" >> "$GITHUB_OUTPUT"
            echo "styles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
            head="$CURRENT_SHA" # the checked-out PR merge commit
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          # The orchestrator keeps the guard and classifier outputs separate,
          # then gives the guard precedence if the classifier itself changed.
          scripts/ci/detect-browser-suites.sh "$base" "$head" "$GITHUB_OUTPUT"

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Validate atom manifest
        run: pnpm check:manifest

      - name: Validate package runtime manifest
        run: pnpm check:package-manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  windows-paths:
    name: Windows path regressions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows path regressions
        run: node --test tests/paths.test.mjs tests/overlay.test.mjs tests/pagefind.test.mjs tests/cli-package-init.test.mjs

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [26.13.0]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

  style-tests:
    name: Style regression shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.styles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run site browser regression shard
        run: bash scripts/ci/run-style-regressions.sh "${{ matrix.shard }}"

  styles:
    # Keep the required check name stable while running four parallel shards.
    name: Style regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, style-tests]
    if: always()
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      SHOULD_RUN: ${{ needs.changes.outputs.styles }}
      TEST_RESULT: ${{ needs.style-tests.result }}

    steps:
      - name: Verify style regression result
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid styles value."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Style regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Style regression check passed (suite selected: $SHOULD_RUN)."

  # Shirones full package validation removed for this site fork: it packs the theme and
  # runs upstream override tests that assume the demo content/config, which this site no longer uses.
